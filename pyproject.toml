[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-data"
version = "0.3.7"
description = "Local reproducible market and event data for quantitative research"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4", "pyarrow>=15,<24",
]

[project.optional-dependencies]
qlib = ["pyqlib==0.9.7"]

[project.scripts]
axiom-data = "axiom_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.data-files]
"share/axiom-data" = ["requirements-local.lock", "requirements-qlib.lock"]
