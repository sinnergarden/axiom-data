[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-data"
version = "0.0.0"
description = "Immutable data publication contracts for the Axiom project family"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
axiom-data = "axiom_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"axiom_data.contracts" = ["*.json"]
"axiom_data.source_profiles" = ["*.json"]
"axiom_data.scope" = ["*.json"]
